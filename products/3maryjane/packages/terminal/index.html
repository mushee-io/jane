<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="3maryjane — unified clearing, risk and execution infrastructure for Monad."
    />
    <title>3maryjane — Clearing House</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>

    <style>
      :root { --bg:#000; --fg:#fff; --pad-x:clamp(20px,6.95vw,120px) }
      * { box-sizing:border-box; margin:0; padding:0 }
      html,body { width:100%; height:100%; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden }
      body { min-width:0 }
      a,button { font:inherit }
      button { border:0 }
      img,svg { display:block }
      #root { display:none }
      body.terminal-open { overflow:auto }
      body.terminal-open #root { display:block }
      body.terminal-open #clearingHero { display:none }

      .hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
      #scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
      #scene.dragging { cursor:grabbing }
      .ui { position:absolute; inset:0; pointer-events:none; z-index:2 }
      .ui a,.ui button { pointer-events:auto }
      .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

      .nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
      .logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-.01em }
      .logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
      .logo b { font-weight:700 }
      .logo span { font-weight:400; opacity:.72 }
      .nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; align-items:center }
      .nav-links a,.nav-links button { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; background:none; cursor:pointer }
      .nav-links a::after,.nav-links button::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
      .nav-links a:hover::after,.nav-links button:hover::after { transform:scaleX(1); transform-origin:left }

      .arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
      .arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s,color .25s }
      .arrow svg { width:18px; height:18px }
      .arrow:hover { background:#fff; color:#000 }

      .dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px }
      .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s }
      .dot.active { background:transparent }

      .tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-.01em }
      .tagline strong { font-weight:700; display:block }

      .cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
      .cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s,color .25s }
      .cta:hover { background:#fff; color:#000 }
      .cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
      .count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-.05em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }

      .loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
      .loader.done { opacity:0 }

      :focus-visible { outline:2px solid #fff; outline-offset:3px; border-radius:4px }

      @media (max-width:900px),(max-aspect-ratio:1/1) {
        .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
        .tagline { bottom:clamp(150px,20vh,220px) }
        .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
        .count { font-size:clamp(120px,22vw,200px) }
      }
      @media (max-width:640px) {
        .nav-links { gap:16px }
        .nav-links a,.nav-links button,.logo { font-size:13px }
        .logo span { display:none }
        .dots { gap:20px; right:16px }
        .dot { width:10px; height:10px }
        .cta-row { right:-8vw }
        .count { font-size:120px }
      }
      @media (max-width:420px) {
        .nav-links li:nth-child(2) { display:none }
      }
    </style>
  </head>
  <body>
    <section class="hero" id="clearingHero">
      <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>

      <div class="ui">
        <h1 class="sr-only">3maryjane Clearing House</h1>

        <header class="nav">
          <a href="/clearing" class="logo" aria-label="3maryjane Clearing House">
            <i class="logo-mark"></i><b>3maryjane</b><span>Clearing House</span>
          </a>

          <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/jane">Jane AI</a></li>
            <li><button type="button" data-enter-terminal>Terminal</button></li>
          </ul>
        </header>

        <div class="arrows">
          <button class="arrow" id="prev" type="button" aria-label="Rotate left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
          </button>
          <button class="arrow" id="next" type="button" aria-label="Rotate right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>

        <nav class="dots" aria-label="Clearing House views">
          <button class="dot" type="button" aria-label="View one"></button>
          <button class="dot active" type="button" aria-label="View two"></button>
          <button class="dot" type="button" aria-label="View three"></button>
        </nav>

        <p class="tagline">One account.<br>Every market.<strong>One risk layer.</strong></p>

        <div class="cta-row">
          <button type="button" class="cta" data-enter-terminal>Open Clearing</button>
          <span class="cta-line"></span>
          <span class="count" aria-hidden="true">3M</span>
        </div>

        <div class="loader" id="loader">Loading model</div>
      </div>
    </section>

    <div id="root"></div>

    <script>
      (() => {
        const enter = () => {
          document.body.classList.add('terminal-open');
          if (location.hash !== '#terminal') history.replaceState(null, '', '#terminal');
          window.dispatchEvent(new Event('3maryjane:terminal-open'));
        };

        document.querySelectorAll('[data-enter-terminal]').forEach((node) => {
          node.addEventListener('click', enter);
        });

        if (location.hash === '#terminal') {
          document.body.classList.add('terminal-open');
        }
      })();
    </script>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
      import { mergeVertices, mergeGeometries } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/utils/BufferGeometryUtils.js';
      import { RoundedBoxGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/geometries/RoundedBoxGeometry.js';

      if (!document.body.classList.contains('terminal-open')) {
        const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
        const canvas = document.getElementById('scene');
        const loaderEl = document.getElementById('loader');

        const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
        renderer.setClearColor(0x000000, 1);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        const scene = new THREE.Scene();
        const bgScene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0,0,10);
        camera.lookAt(0,0,0);
        const bgCamera = new THREE.Camera();

        const headlineCanvas = document.createElement('canvas');
        const headlineTexture = new THREE.CanvasTexture(headlineCanvas);
        headlineTexture.colorSpace = THREE.SRGBColorSpace;
        headlineTexture.minFilter = THREE.LinearFilter;
        headlineTexture.magFilter = THREE.LinearFilter;
        headlineTexture.generateMipmaps = false;

        const bgMat = new THREE.ShaderMaterial({
          depthTest:false,
          depthWrite:false,
          uniforms:{ uTex:{ value:headlineTexture } },
          vertexShader:`
            varying vec2 vUv;
            void main(){
              vUv = uv;
              gl_Position = vec4(position.xy,0.0,1.0);
            }
          `,
          fragmentShader:`
            uniform sampler2D uTex;
            varying vec2 vUv;
            void main(){
              gl_FragColor = texture2D(uTex,vUv);
              #include <colorspace_fragment>
            }
          `
        });
        const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat);
        bgQuad.frustumCulled = false;
        bgScene.add(bgQuad);

        const rtBack = new THREE.WebGLRenderTarget(1,1,{ type:THREE.HalfFloatType });
        const rtFront = new THREE.WebGLRenderTarget(1,1,{ type:THREE.HalfFloatType });

        const commonUniforms = () => ({
          uTexture:{ value:null },
          uResolution:{ value:new THREE.Vector2(1,1) },
          uIorR:{ value:1.15 },
          uIorY:{ value:1.16 },
          uIorG:{ value:1.18 },
          uIorC:{ value:1.22 },
          uIorB:{ value:1.22 },
          uIorP:{ value:1.22 },
          uRefractPower:{ value:.30 },
          uChromatic:{ value:.5 },
          uSaturation:{ value:1.08 },
          uShininess:{ value:90.0 },
          uDiffuseness:{ value:.02 },
          uFresnelPower:{ value:5.0 },
          uLight:{ value:new THREE.Vector3(-1,1,1) },
          uBackside:{ value:0.0 }
        });

        const vertexShader = `
          varying vec3 vNormal;
          varying vec3 vEye;
          void main(){
            vec4 worldPos = modelMatrix * vec4(position,1.0);
            vec4 mvPos = viewMatrix * worldPos;
            gl_Position = projectionMatrix * mvPos;
            vNormal = normalize(normalMatrix * normal);
            vEye = normalize(mvPos.xyz);
          }
        `;

        const fragmentShader = `
          uniform sampler2D uTexture;
          uniform vec2 uResolution;
          uniform float uIorR;
          uniform float uIorY;
          uniform float uIorG;
          uniform float uIorC;
          uniform float uIorB;
          uniform float uIorP;
          uniform float uRefractPower;
          uniform float uChromatic;
          uniform float uSaturation;
          uniform float uShininess;
          uniform float uDiffuseness;
          uniform float uFresnelPower;
          uniform vec3 uLight;
          uniform float uBackside;
          varying vec3 vNormal;
          varying vec3 vEye;

          float specularTerm(vec3 n, vec3 eye, vec3 light, float shininess, float diffuseness){
            vec3 lightVec = normalize(-light);
            vec3 viewVec = -eye;
            vec3 halfVec = normalize(lightVec + viewVec);
            return pow(max(dot(n,halfVec),0.0),shininess) + max(0.0,dot(n,lightVec))*diffuseness;
          }

          void main(){
            vec2 uv = gl_FragCoord.xy / uResolution;
            vec3 n = normalize(vNormal);
            if(uBackside > .5) n = -n;
            vec3 eye = normalize(vEye);
            vec3 color = vec3(0.0);
            const int LOOP = 16;

            for(int i=0;i<LOOP;i++){
              float slide = float(i)/float(LOOP)*.045;
              vec3 refrR = refract(eye,n,1.0/uIorR);
              vec3 refrY = refract(eye,n,1.0/uIorY);
              vec3 refrG = refract(eye,n,1.0/uIorG);
              vec3 refrC = refract(eye,n,1.0/uIorC);
              vec3 refrB = refract(eye,n,1.0/uIorB);
              vec3 refrP = refract(eye,n,1.0/uIorP);

              vec3 texR = texture2D(uTexture,uv + refrR.xy*(uRefractPower + slide*1.0)*uChromatic).rgb;
              vec3 texY = texture2D(uTexture,uv + refrY.xy*(uRefractPower + slide*1.0)*uChromatic).rgb;
              vec3 texG = texture2D(uTexture,uv + refrG.xy*(uRefractPower + slide*2.0)*uChromatic).rgb;
              vec3 texC = texture2D(uTexture,uv + refrC.xy*(uRefractPower + slide*2.5)*uChromatic).rgb;
              vec3 texB = texture2D(uTexture,uv + refrB.xy*(uRefractPower + slide*3.0)*uChromatic).rgb;
              vec3 texP = texture2D(uTexture,uv + refrP.xy*(uRefractPower + slide*1.0)*uChromatic).rgb;

              float r = texR.r*.5;
              float y = (texY.r*2.0 + texY.g*2.0 - texY.b)/6.0;
              float g = texG.g*.5;
              float c = (texC.g*2.0 + texC.b*2.0 - texC.r)/6.0;
              float b = texB.b*.5;
              float p = (texP.b*2.0 + texP.r*2.0 - texP.g)/6.0;

              float outR = r + (2.0*p + 2.0*y - c)/3.0;
              float outG = g + (2.0*y + 2.0*c - p)/3.0;
              float outB = b + (2.0*c + 2.0*p - y)/3.0;
              color += vec3(outR,outG,outB);
            }

            color /= float(LOOP);
            float luma = dot(color,vec3(.2125,.7154,.0721));
            color = mix(vec3(luma),color,uSaturation);

            float spec = specularTerm(n,eye,uLight,uShininess,uDiffuseness)
              + .6*specularTerm(n,eye,vec3(1.0,1.0,-1.0),uShininess*.6,uDiffuseness*.5);
            color += spec*(uBackside>.5?.35:1.0);

            float fresnel = pow(1.0 + dot(eye,n),uFresnelPower);
            color = mix(color,vec3(1.0),fresnel*(uBackside>.5?.25:.55));
            color += vec3(.004,.005,.007);
            gl_FragColor = vec4(color,1.0);
            #include <colorspace_fragment>
          }
        `;

        const frontUniforms = commonUniforms();
        const backUniforms = commonUniforms();
        frontUniforms.uTexture.value = rtFront.texture;
        frontUniforms.uRefractPower.value = .30;
        frontUniforms.uBackside.value = 0.0;
        backUniforms.uTexture.value = rtBack.texture;
        backUniforms.uRefractPower.value = .22;
        backUniforms.uBackside.value = 1.0;

        const frontMat = new THREE.ShaderMaterial({
          uniforms:frontUniforms,
          vertexShader,
          fragmentShader,
          side:THREE.FrontSide
        });
        const backMat = new THREE.ShaderMaterial({
          uniforms:backUniforms,
          vertexShader,
          fragmentShader,
          side:THREE.BackSide
        });

        const pivot = new THREE.Group();
        const spinner = new THREE.Group();
        pivot.add(spinner);
        scene.add(pivot);

        let cube = null;
        let running = true;
        let W = 1;
        let H = 1;
        let mobile = false;

        function normalizeGeometry(geometry){
          geometry.computeBoundingBox();
          const box = geometry.boundingBox;
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);
          geometry.translate(-center.x,-center.y,-center.z);
          const maxDim = Math.max(size.x,size.y,size.z) || 1;
          geometry.scale(1/maxDim,1/maxDim,1/maxDim);
          geometry.computeVertexNormals();
          return geometry;
        }

        function installGeometry(geometry){
          if(cube){
            spinner.remove(cube);
            cube.geometry.dispose();
          }
          cube = new THREE.Mesh(normalizeGeometry(geometry),frontMat);
          spinner.add(cube);
          spinner.rotation.set(-.42,.62,.18);
          loaderEl.classList.add('done');
          layout();
        }

        new GLTFLoader().load(
          MODEL_URL,
          (gltf) => {
            gltf.scene.updateMatrixWorld(true);
            const parts = [];
            gltf.scene.traverse((child) => {
              if(!child.isMesh || !child.geometry) return;
              let g = child.geometry.clone();
              ['uv','color','tangent'].forEach((name) => g.deleteAttribute(name));
              g = mergeVertices(g,1e-4);
              g.computeVertexNormals();
              g.applyMatrix4(child.matrixWorld);
              parts.push(g);
            });
            const merged = parts.length ? mergeGeometries(parts,false) : null;
            if(merged) installGeometry(merged);
            else installGeometry(new RoundedBoxGeometry(1,1,1,8,.12));
          },
          undefined,
          () => installGeometry(new RoundedBoxGeometry(1,1,1,8,.12))
        );

        function drawHeadline(){
          const dpr = Math.min(window.devicePixelRatio || 1,2);
          headlineCanvas.width = Math.max(1,Math.floor(W*dpr));
          headlineCanvas.height = Math.max(1,Math.floor(H*dpr));
          const ctx = headlineCanvas.getContext('2d');
          ctx.setTransform(dpr,0,0,dpr,0,0);
          ctx.fillStyle = '#000';
          ctx.fillRect(0,0,W,H);

          mobile = (W < 768) || (W/H < 1);
          let fs = Math.min(H*.21,W*(mobile?.21:.118));
          const lines = ['Clear','Every','Market'];
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.font = `800 ${fs}px Poppins`;

          const maxWidth = W*(mobile?.9:.5);
          const widest = Math.max(...lines.map((line) => ctx.measureText(line).width));
          if(widest > maxWidth){
            fs *= maxWidth/widest;
            ctx.font = `800 ${fs}px Poppins`;
          }

          const cx = W*(mobile?.5:.505);
          const cy = H*(mobile?.45:.468);
          const gap = fs*1.07;
          const cap = fs*.7;
          ctx.fillStyle = '#e9e9e9';
          lines.forEach((line,i) => {
            const y = cy + cap/2 + (i-1)*gap;
            ctx.fillText(line,cx,y);
          });
          headlineTexture.needsUpdate = true;
        }

        function layout(){
          W = Math.max(1,window.innerWidth);
          H = Math.max(1,window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
          renderer.setSize(W,H,false);
          camera.aspect = W/H;
          camera.updateProjectionMatrix();

          const drawing = new THREE.Vector2();
          renderer.getDrawingBufferSize(drawing);
          rtBack.setSize(drawing.x,drawing.y);
          rtFront.setSize(drawing.x,drawing.y);
          frontUniforms.uResolution.value.copy(drawing);
          backUniforms.uResolution.value.copy(drawing);

          drawHeadline();

          mobile = (W < 768) || (W/H < 1);
          const fov = THREE.MathUtils.degToRad(camera.fov);
          const visH = 2*Math.tan(fov/2)*10;
          const visW = visH*camera.aspect;
          const sx = mobile?.5:.517;
          const sy = mobile?.45:.488;
          pivot.position.set((sx-.5)*visW,(.5-sy)*visH,0);

          const px = Math.min(H*.44,W*(mobile?.45:.29));
          const scale = (px/H)*visH;
          pivot.scale.setScalar(scale);
        }

        const waitForFonts = Promise.race([
          Promise.all([
            document.fonts.load('800 100px Poppins'),
            document.fonts.ready
          ]),
          new Promise((resolve) => setTimeout(resolve,2500))
        ]);

        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        let lastPointerTime = 0;
        let velX = 0;
        let velY = 0;
        let targetSpin = 0;
        let lastRelease = performance.now() - 2000;

        const qY = new THREE.Quaternion();
        const qX = new THREE.Quaternion();
        const axisY = new THREE.Vector3(0,1,0);
        const axisX = new THREE.Vector3(1,0,0);

        function rotateWorld(dx,dy){
          qY.setFromAxisAngle(axisY,dx);
          qX.setFromAxisAngle(axisX,dy);
          spinner.quaternion.premultiply(qY);
          spinner.quaternion.premultiply(qX);
        }

        canvas.addEventListener('pointerdown',(event) => {
          dragging = true;
          targetSpin = 0;
          velX = 0;
          velY = 0;
          lastX = event.clientX;
          lastY = event.clientY;
          lastPointerTime = performance.now();
          canvas.setPointerCapture(event.pointerId);
          canvas.classList.add('dragging');
        });

        canvas.addEventListener('pointermove',(event) => {
          if(!dragging) return;
          const now = performance.now();
          const dxPx = event.clientX-lastX;
          const dyPx = event.clientY-lastY;
          const frame = Math.max(.25,(now-lastPointerTime)/16.67);
          const dx = dxPx*.008;
          const dy = dyPx*.008;
          rotateWorld(dx,dy);
          velX = dx/frame;
          velY = dy/frame;
          lastX = event.clientX;
          lastY = event.clientY;
          lastPointerTime = now;
        });

        function release(event){
          if(!dragging) return;
          dragging = false;
          lastRelease = performance.now();
          try{ canvas.releasePointerCapture(event.pointerId); }catch{}
          canvas.classList.remove('dragging');
        }
        canvas.addEventListener('pointerup',release);
        canvas.addEventListener('pointercancel',release);

        document.getElementById('prev').addEventListener('click',() => {
          targetSpin = -Math.PI/2;
          velX = velY = 0;
          lastRelease = performance.now();
        });
        document.getElementById('next').addEventListener('click',() => {
          targetSpin = Math.PI/2;
          velX = velY = 0;
          lastRelease = performance.now();
        });

        document.querySelectorAll('.dot').forEach((dot) => {
          dot.addEventListener('click',() => {
            document.querySelectorAll('.dot').forEach((d) => d.classList.remove('active'));
            dot.classList.add('active');
          });
        });

        let lastFrame = performance.now();

        function renderGlass(){
          if(!cube) {
            renderer.setRenderTarget(null);
            renderer.render(bgScene,bgCamera);
            return;
          }

          renderer.autoClear = true;

          renderer.setRenderTarget(rtBack);
          renderer.clear();
          renderer.render(bgScene,bgCamera);

          renderer.setRenderTarget(rtFront);
          renderer.clear();
          renderer.render(bgScene,bgCamera);
          renderer.autoClear = false;
          renderer.clearDepth();
          cube.material = backMat;
          renderer.render(scene,camera);

          renderer.setRenderTarget(null);
          renderer.autoClear = true;
          renderer.clear();
          renderer.render(bgScene,bgCamera);
          renderer.autoClear = false;
          renderer.clearDepth();
          cube.material = frontMat;
          renderer.render(scene,camera);
          renderer.autoClear = true;
        }

        function loop(now){
          if(!running) return;
          requestAnimationFrame(loop);
          const dt = Math.min(.05,Math.max(.001,(now-lastFrame)/1000));
          lastFrame = now;
          const frameScale = dt*60;

          if(!dragging){
            if(Math.abs(targetSpin) > .0005){
              const step = targetSpin*Math.min(1,.09*frameScale);
              rotateWorld(step,0);
              targetSpin -= step;
            }else{
              targetSpin = 0;
              if(Math.abs(velX) > .00001 || Math.abs(velY) > .00001){
                rotateWorld(velX*frameScale,velY*frameScale);
                const damping = Math.pow(.94,frameScale);
                velX *= damping;
                velY *= damping;
              }

              const idleElapsed = Math.max(0,(now-lastRelease)/1000-.6);
              const idleBlend = Math.min(1,idleElapsed/1);
              if(idleBlend > 0){
                rotateWorld(.0035*frameScale*idleBlend,.0012*frameScale*idleBlend);
              }
            }
          }

          renderGlass();
        }

        function stopScene(){
          running = false;
          renderer.setAnimationLoop(null);
          rtBack.dispose();
          rtFront.dispose();
          bgQuad.geometry.dispose();
          bgMat.dispose();
          frontMat.dispose();
          backMat.dispose();
          renderer.dispose();
        }

        window.addEventListener('3maryjane:terminal-open',stopScene,{once:true});
        window.addEventListener('resize',layout,{passive:true});
        document.fonts.addEventListener?.('loadingdone',layout);

        await waitForFonts;
        layout();
        requestAnimationFrame((t) => {
          lastFrame = t;
          loop(t);
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
